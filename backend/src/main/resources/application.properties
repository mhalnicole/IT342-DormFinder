spring.application.name=dormfinder-backend
server.port=8080

# Database Configuration (MariaDB / MySQL on localhost:3306)
spring.datasource.url=jdbc:mariadb://localhost:3306/dormfinder_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Secret Configuration (256-bit HMAC key)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.dormfinder=DEBUG
logging.level.org.springframework.security=INFO
